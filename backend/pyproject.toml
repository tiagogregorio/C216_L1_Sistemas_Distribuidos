[project]
name = "backend"
version = "0.1.0"
description = "Backend do laboratorio de Sistemas Distribuidos, com FastAPI"
authors = [
    {name = "Tiago R. Gregorio",email = "trgtiago@hotmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "httpx2 (>=2.13.0,<3.0.0)"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"